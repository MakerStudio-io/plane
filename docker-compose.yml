services:
  web:
    container_name: web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile.web
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL}
      NEXT_PUBLIC_API_BASE_PATH: ${API_BASE_PATH}
      NEXT_PUBLIC_ADMIN_BASE_URL: ${ADMIN_BASE_URL}
      NEXT_PUBLIC_ADMIN_BASE_PATH: ${ADMIN_BASE_PATH}
      NEXT_PUBLIC_SPACE_BASE_URL: ${SPACE_BASE_URL}
      NEXT_PUBLIC_SPACE_BASE_PATH: ${SPACE_BASE_PATH}
      NEXT_PUBLIC_LIVE_BASE_URL: ${LIVE_BASE_URL}
      NEXT_PUBLIC_LIVE_BASE_PATH: ${LIVE_BASE_PATH}
      NEXT_PUBLIC_WEB_BASE_URL: ${WEB_BASE_URL}
      NEXT_PUBLIC_WEB_BASE_PATH: ${WEB_BASE_PATH}
      NEXT_PUBLIC_WEBSITE_URL: ${WEBSITE_URL}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL}

  admin:
    container_name: admin
    build:
      context: .
      dockerfile: ./apps/admin/Dockerfile.admin
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL}
      NEXT_PUBLIC_API_BASE_PATH: ${API_BASE_PATH}
      NEXT_PUBLIC_ADMIN_BASE_URL: ${ADMIN_BASE_URL}
      NEXT_PUBLIC_ADMIN_BASE_PATH: ${ADMIN_BASE_PATH}
      NEXT_PUBLIC_SPACE_BASE_URL: ${SPACE_BASE_URL}
      NEXT_PUBLIC_SPACE_BASE_PATH: ${SPACE_BASE_PATH}
      NEXT_PUBLIC_LIVE_BASE_URL: ${LIVE_BASE_URL}
      NEXT_PUBLIC_LIVE_BASE_PATH: ${LIVE_BASE_PATH}
      NEXT_PUBLIC_WEB_BASE_URL: ${WEB_BASE_URL}
      NEXT_PUBLIC_WEB_BASE_PATH: ${WEB_BASE_PATH}
      NEXT_PUBLIC_WEBSITE_URL: ${WEBSITE_URL}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL}

  space:
    container_name: space
    build:
      context: .
      dockerfile: ./apps/space/Dockerfile.space
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    depends_on:
      - api
      - web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL}
      NEXT_PUBLIC_API_BASE_PATH: ${API_BASE_PATH}
      NEXT_PUBLIC_ADMIN_BASE_URL: ${ADMIN_BASE_URL}
      NEXT_PUBLIC_ADMIN_BASE_PATH: ${ADMIN_BASE_PATH}
      NEXT_PUBLIC_SPACE_BASE_URL: ${SPACE_BASE_URL}
      NEXT_PUBLIC_SPACE_BASE_PATH: ${SPACE_BASE_PATH}
      NEXT_PUBLIC_LIVE_BASE_URL: ${LIVE_BASE_URL}
      NEXT_PUBLIC_LIVE_BASE_PATH: ${LIVE_BASE_PATH}
      NEXT_PUBLIC_WEB_BASE_URL: ${WEB_BASE_URL}
      NEXT_PUBLIC_WEB_BASE_PATH: ${WEB_BASE_PATH}
      NEXT_PUBLIC_WEBSITE_URL: ${WEBSITE_URL}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL}

  api:
    container_name: api
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-api.sh
    environment:
      DEBUG: ${DEBUG}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT}
      WEB_URL: ${WEB_URL}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL}
      ADMIN_BASE_PATH: ${ADMIN_BASE_PATH}
      SPACE_BASE_URL: ${SPACE_BASE_URL}
      SPACE_BASE_PATH: ${SPACE_BASE_PATH}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_BASE_PATH: ${APP_BASE_PATH}
      LIVE_BASE_URL: ${LIVE_BASE_URL}
      LIVE_BASE_PATH: ${LIVE_BASE_PATH}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
      HARD_DELETE_AFTER_DAYS: ${HARD_DELETE_AFTER_DAYS}
      MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL}
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      USE_MINIO: ${USE_MINIO}
    depends_on:
      - plane-db
      - plane-redis

  worker:
    container_name: bgworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-worker.sh
    environment:
      DEBUG: ${DEBUG}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT}
      WEB_URL: ${WEB_URL}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL}
      ADMIN_BASE_PATH: ${ADMIN_BASE_PATH}
      SPACE_BASE_URL: ${SPACE_BASE_URL}
      SPACE_BASE_PATH: ${SPACE_BASE_PATH}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_BASE_PATH: ${APP_BASE_PATH}
      LIVE_BASE_URL: ${LIVE_BASE_URL}
      LIVE_BASE_PATH: ${LIVE_BASE_PATH}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
      HARD_DELETE_AFTER_DAYS: ${HARD_DELETE_AFTER_DAYS}
      MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL}
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      USE_MINIO: ${USE_MINIO}
    depends_on:
      - api
      - plane-db
      - plane-redis

  beat-worker:
    container_name: beatworker
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    command: ./bin/docker-entrypoint-beat.sh
    environment:
      DEBUG: ${DEBUG}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT}
      WEB_URL: ${WEB_URL}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL}
      ADMIN_BASE_PATH: ${ADMIN_BASE_PATH}
      SPACE_BASE_URL: ${SPACE_BASE_URL}
      SPACE_BASE_PATH: ${SPACE_BASE_PATH}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_BASE_PATH: ${APP_BASE_PATH}
      LIVE_BASE_URL: ${LIVE_BASE_URL}
      LIVE_BASE_PATH: ${LIVE_BASE_PATH}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
      HARD_DELETE_AFTER_DAYS: ${HARD_DELETE_AFTER_DAYS}
      MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL}
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      USE_MINIO: ${USE_MINIO}
    depends_on:
      - api
      - plane-db
      - plane-redis

  migrator:
    container_name: plane-migrator
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
      args:
        DOCKER_BUILDKIT: 1
    restart: no
    command: ./bin/docker-entrypoint-migrator.sh
    environment:
      DEBUG: ${DEBUG}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_URL: ${REDIS_URL}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT}
      WEB_URL: ${WEB_URL}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS}
      ADMIN_BASE_URL: ${ADMIN_BASE_URL}
      ADMIN_BASE_PATH: ${ADMIN_BASE_PATH}
      SPACE_BASE_URL: ${SPACE_BASE_URL}
      SPACE_BASE_PATH: ${SPACE_BASE_PATH}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_BASE_PATH: ${APP_BASE_PATH}
      LIVE_BASE_URL: ${LIVE_BASE_URL}
      LIVE_BASE_PATH: ${LIVE_BASE_PATH}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
      HARD_DELETE_AFTER_DAYS: ${HARD_DELETE_AFTER_DAYS}
      MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL}
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT}
      SECRET_KEY: ${SECRET_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      USE_MINIO: ${USE_MINIO}
    depends_on:
      - plane-db
      - plane-redis

  live:
    container_name: plane-live
    build:
      context: .
      dockerfile: ./apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: always
    environment:
      API_BASE_URL: ${API_BASE_URL}
      REDIS_URL: ${REDIS_URL}
      PORT: ${LIVE_PORT}
      HOSTNAME: ${LIVE_HOSTNAME}
      LIVE_BASE_PATH: ${LIVE_BASE_PATH}

  plane-db:
    container_name: plane-db
    image: postgres:15.7-alpine
    restart: always
    command: postgres -c 'max_connections=1000'
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data

  plane-redis:
    container_name: plane-redis
    image: valkey/valkey:7.2.5-alpine
    restart: always
    volumes:
      - redisdata:/data

  plane-mq:
    container_name: plane-mq
    image: rabbitmq:3.13.6-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  plane-minio:
    container_name: plane-minio
    image: minio/minio
    restart: always
    command: server /export --console-address ":9090"
    volumes:
      - uploads:/export
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

  # Comment this if you already have a reverse proxy running
  proxy:
    container_name: proxy
    build:
      context: ./apps/proxy
      dockerfile: Dockerfile.ce
    restart: always
    ports:
      - ${LISTEN_HTTP_PORT}:80
      - ${LISTEN_HTTPS_PORT}:443
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME}
    depends_on:
      - web
      - api
      - space
      - admin

volumes:
  pgdata:
  redisdata:
  uploads:
  rabbitmq_data:
